services:
  backend:
    build:
      context: ./backend
    container_name: videobrief-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./storage/backend-data:/app/data
      - ./storage/backend-downloads:/app/downloads
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    container_name: videobrief-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
